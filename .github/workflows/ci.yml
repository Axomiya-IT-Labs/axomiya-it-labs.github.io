name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm validate:content

      - name: Build site
        run: pnpm build

      - name: Verify critical files exist
        run: |
          test -f dist/index.html || (echo "❌ dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "❌ dist/404.html missing" && exit 1)
          test -f dist/robots.txt || (echo "❌ dist/robots.txt missing" && exit 1)
          test -f dist/sitemap-index.xml || (echo "❌ dist/sitemap-index.xml missing" && exit 1)
          test -f dist/.nojekyll || (echo "❌ dist/.nojekyll missing" && exit 1)
          test -f dist/og/blog/welcome-to-axomiya.png || (echo "❌ OG image missing" && exit 1)
          test -f dist/pagefind/pagefind.js || (echo "❌ Pagefind index missing" && exit 1)
          echo "✅ All critical files present"

      - name: Check for broken image references
        run: |
          # Find any /assets/ paths in built HTML that don't exist in dist/
          grep -roh 'src="/[^"]*"' dist/ --include="*.html" | \
            sed 's/src="\///;s/"$//' | \
            sort -u | \
            while read -r file; do
              if [ -n "$file" ] && [ ! -f "dist/$file" ] && [ ! -d "dist/$file" ]; then
                echo "⚠️  Broken reference: /$file"
              fi
            done
          echo "✅ Image reference check complete"